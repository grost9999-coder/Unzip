name: Native iOS build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Open native source package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path.cwd()
          with zipfile.ZipFile('NativeSource.zip') as z:
              for item in z.infolist():
                  path=Path(item.filename)
                  if path.parts and path.parts[0]=='.github': continue
                  target=(root/path).resolve()
                  if not target.is_relative_to(root): raise SystemExit('Unsafe source path')
                  z.extract(item,root)
          PY
      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -project PocketUnzip.xcodeproj -scheme PocketUnzip
      - name: Choose iPhone simulator
        run: |
          python3 - <<'PY'
          import json,subprocess,os
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))
          phones=[d for runtime,group in data['devices'].items() if '.iOS-' in runtime for d in group if 'iPhone' in d['name']]
          if not phones: raise SystemExit('No iPhone simulator')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('SIMULATOR_ID='+phones[0]['udid']+'\n')
          PY
      - name: Test native app including 201 MiB extraction
        run: xcodebuild test -project PocketUnzip.xcodeproj -scheme PocketUnzip -destination "platform=iOS Simulator,id=$SIMULATOR_ID" CODE_SIGNING_ALLOWED=NO -resultBundlePath TestResults.xcresult
      - name: Build unsigned device archive
        run: xcodebuild archive -project PocketUnzip.xcodeproj -scheme PocketUnzip -destination 'generic/platform=iOS' -archivePath build/PocketUnzip.xcarchive CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-iOS-results
          path: |
            TestResults.xcresult
            build/PocketUnzip.xcarchive
